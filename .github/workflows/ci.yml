name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pm_api_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pm_api
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/pm_api_test
          JWT_SECRET: test_jwt_secret
          JWT_EXPIRES_IN: 15m
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Run migrations on test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/pm_api_test

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pm_api
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/pm_api_test
          JWT_SECRET: test_jwt_secret
          JWT_EXPIRES_IN: 15m
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pm_api
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/pm_api_test
          JWT_SECRET: test_jwt_secret
          JWT_EXPIRES_IN: 15m
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Build TypeScript
        run: npm run build
